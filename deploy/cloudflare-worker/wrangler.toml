name = "grbms-worker"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Bind to your private R2 bucket
[[r2_buckets]]
binding    = "GRBMS_BUCKET"
bucket_name = "grbms-data"

# Secrets (set via CLI, NOT stored here):
#   wrangler secret put JWT_SECRET
#   wrangler secret put PASSWORD_ankit
